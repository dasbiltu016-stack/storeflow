name: Unzip and Build Play Store Ready APK/AAB

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # জিপ ফাইল আনজিপ এবং নিখুঁতভাবে ফাইল সাজানোর স্টেপ
    - name: Unzip Project File
      run: |
        unzip "*.zip" -d extracted_project
        # যদি জিপের ভেতরে কোনো এক্সট্রা ফোল্ডার থাকে, তবে তার ভেতরের ফাইলগুলো মেইন ডিরেক্টরিতে নিয়ে আসবে
        if [ -f extracted_project/gradlew ]; then
          mv extracted_project/* . 2>/dev/null || true
        elif [ -f extracted_project/*/gradlew ]; then
          mv extracted_project/*/* . 2>/dev/null || true
        elif [ -f extracted_project/*/*/gradlew ]; then
          mv extracted_project/*/*/* . 2>/dev/null || true
        fi
        rm -rf extracted_project

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Decode Keystore File
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/my-release-key.jks || echo "No keystore secret yet"

    - name: Build Release APK and AAB
      run: ./gradlew assembleRelease bundleRelease
      env:
        ANDROID_KEYSTORE_FILE: my-release-key.jks
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        singlePop: true
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: play-store-signed-apk
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}

    - name: Upload Signed AAB (Play Store Bundle)
      uses: actions/upload-artifact@v4
      with:
        name: play-store-signed-aab
        path: app/build/outputs/bundle/release/app-release.aab
