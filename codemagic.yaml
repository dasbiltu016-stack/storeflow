workflows:
  android-native-build:
    name: Android Native Kotlin Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Unzip and Prepare Project
        script: |
          echo "Unzipping file..."
          unzip -o "*.zip" -d extracted_project
          
          # নিখুঁতভাবে gradlew ফাইলটির মূল ডিরেক্টরি খুঁজে বের করা হচ্ছে
          GRADLEW_PATH=$(find extracted_project -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
            echo "Android Project found in: $PROJECT_ROOT"
            
            # প্রজেক্টের সব ফাইল মূল ডিরেক্টরিতে কপি করা হচ্ছে
            cp -R "$PROJECT_ROOT"/* . 2>/dev/null || true
            cp -R "$PROJECT_ROOT"/.* . 2>/dev/null || true
          else
            echo "Error: Could not find gradlew inside the zip file!"
            exit 1
          fi
          
          rm -rf extracted_project
          chmod +x gradlew
          
      - name: Build Android App (APK & AAB)
        script: |
          ./gradlew assembleRelease bundleRelease --no-daemon
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
